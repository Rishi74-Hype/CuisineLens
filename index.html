    <script>
      (function() {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var fallbackFetch = window.fetch;
            window.fetch = function() {
              return fallbackFetch.apply(this, arguments);
            };
          } catch (err) {}
        }
      })();
    </script>
